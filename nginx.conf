server {
    listen 9084;  # Modified to listen on port 9084
    server_name localhost;
 
    root /usr/share/nginx/html;
    index index.html;
 
    location / {
        try_files $uri /index.html;
    }
 
    error_page 404 /index.html;
 
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires max;
        access_log off;
    }
}